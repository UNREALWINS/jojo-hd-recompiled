name: Build JoJo image extractor v1.2

on:
  push:
    paths:
      - ".github/workflows/build-jojo-image-extractor-v12.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Prepare sources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src | Out-Null
          Copy-Item .tmp\jojo_img_extract_v12.cpp src\jojo_img_extract.cpp
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/Laupetin/OpenAssetTools/main/thirdparty/lzx/lzx.c' -OutFile 'src\lzx.c'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/Laupetin/OpenAssetTools/main/thirdparty/lzx/lzx.h' -OutFile 'src\lzx.h'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/nothings/stb/master/stb_image_write.h' -OutFile 'src\stb_image_write.h'
      - name: Compile standalone x64
        shell: pwsh
        run: |
          Push-Location src
          cl /nologo /c /O2 /MT /EHsc /std:c++20 /D_CRT_SECURE_NO_WARNINGS jojo_img_extract.cpp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cl /nologo /c /O2 /MT /TC /D_CRT_SECURE_NO_WARNINGS lzx.c
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          link /nologo jojo_img_extract.obj lzx.obj /OUT:EXTRAIR_IMAGENS_JOJO.exe /SUBSYSTEM:CONSOLE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dumpbin /headers EXTRAIR_IMAGENS_JOJO.exe | Out-File -Encoding ascii headers.txt
          dumpbin /dependents EXTRAIR_IMAGENS_JOJO.exe | Out-File -Encoding ascii dependents.txt
          $deps=Get-Content -Raw dependents.txt
          if ($deps -match 'VCRUNTIME|MSVCP|libwinpthread|libstdc\+\+|libgcc') { throw 'Runtime externo inesperado.' }
          Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: JoJo-HD-Extrator-Imagens-v1.2-x64
          path: |
            src/EXTRAIR_IMAGENS_JOJO.exe
            src/jojo_img_extract.cpp
            src/lzx.c
            src/lzx.h
            src/stb_image_write.h
            src/dependents.txt
            src/headers.txt
          if-no-files-found: error
