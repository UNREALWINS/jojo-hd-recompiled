name: Build launcher pack

on:
  push:
    paths:
      - ".github/workflows/build-launcher-pack.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare private-pack launcher source
        shell: pwsh
        run: |
          $src = Get-Content -Raw launcher\JoJo_HD_Launcher.cpp

          $external = @'
          static bool LoadExternalBackground() {
              fs::path p = fs::path(ExeDir()) / L".launcher" / L"launcher_bg.png";
              if (!Exists(p)) return false;
              Image* img = Image::FromFile(p.c_str(), FALSE);
              if (!img || img->GetLastStatus() != Ok) {
                  if (img) delete img;
                  return false;
              }
              gBg.reset(img);
              return true;
          }

          '@

          $marker = 'static void DrawState(HDC hdc) {'
          $src = $src.Replace($marker, $external + $marker)
          $src = $src.Replace('LoadEmbeddedBackground(h);', 'if (!LoadExternalBackground()) LoadEmbeddedBackground(h);')

          $oldIcon = 'WNDCLASSEXW wc{};wc.cbSize=sizeof(wc);wc.lpfnWndProc=WndProc;wc.hInstance=h;wc.hCursor=LoadCursor(nullptr,IDC_ARROW);wc.hIcon=LoadIcon(h,MAKEINTRESOURCE(1));if(!wc.hIcon)wc.hIcon=LoadIcon(nullptr,IDI_APPLICATION);wc.hIconSm=wc.hIcon;wc.lpszClassName=kClassName;RegisterClassExW(&wc);'
          $newIcon = 'WNDCLASSEXW wc{};wc.cbSize=sizeof(wc);wc.lpfnWndProc=WndProc;wc.hInstance=h;wc.hCursor=LoadCursor(nullptr,IDC_ARROW);fs::path iconPath=fs::path(ExeDir())/L".launcher"/L"jojo_launcher.ico";wc.hIcon=(HICON)LoadImageW(nullptr,iconPath.c_str(),IMAGE_ICON,0,0,LR_LOADFROMFILE|LR_DEFAULTSIZE);if(!wc.hIcon)wc.hIcon=LoadIcon(h,MAKEINTRESOURCE(1));if(!wc.hIcon)wc.hIcon=LoadIcon(nullptr,IDI_APPLICATION);wc.hIconSm=wc.hIcon;wc.lpszClassName=kClassName;RegisterClassExW(&wc);'
          $src = $src.Replace($oldIcon, $newIcon)

          New-Item -ItemType Directory -Force build-pack | Out-Null
          Set-Content -Encoding UTF8 build-pack\JoJo_HD_Launcher.cpp $src
          Copy-Item launcher\JoJo_HD_Helper.cpp build-pack\JoJo_HD_Helper.cpp

      - name: Compile x64 standalone executables
        shell: pwsh
        run: |
          Push-Location build-pack

          cl.exe /nologo /std:c++20 /O2 /MT /DUNICODE /D_UNICODE /EHsc JoJo_HD_Launcher.cpp /Fe:"JoJo HD Launcher.exe" /link /SUBSYSTEM:WINDOWS gdiplus.lib gdi32.lib user32.lib shell32.lib ole32.lib uuid.lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cl.exe /nologo /std:c++20 /O2 /MT /DUNICODE /D_UNICODE /EHsc JoJo_HD_Helper.cpp /Fe:"JoJo HD Helper.exe" /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dumpbin /headers "JoJo HD Launcher.exe" | Out-File -Encoding ascii headers-launcher.txt
          dumpbin /headers "JoJo HD Helper.exe"   | Out-File -Encoding ascii headers-helper.txt
          dumpbin /dependents "JoJo HD Launcher.exe" | Out-File -Encoding ascii dependents-launcher.txt
          dumpbin /dependents "JoJo HD Helper.exe"   | Out-File -Encoding ascii dependents-helper.txt

          $deps = (Get-Content -Raw dependents-launcher.txt) + (Get-Content -Raw dependents-helper.txt)
          if ($deps -match 'libwinpthread|libstdc\+\+|libgcc|VCRUNTIME|MSVCP[0-9]') {
              Write-Error "Unexpected external runtime dependency detected."
              exit 9
          }

          Pop-Location

      - uses: actions/upload-artifact@v4
        with:
          name: JoJo-HD-Launcher-Standalone-x64
          path: |
            build-pack/JoJo HD Launcher.exe
            build-pack/JoJo HD Helper.exe
            build-pack/dependents-launcher.txt
            build-pack/dependents-helper.txt
          if-no-files-found: error
